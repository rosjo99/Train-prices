name: Deploy booked-dates site

# Publishes site/ (the booked-dates checkbox page) to GitHub Pages.
# Requires a one-time setting: repo Settings -> Pages -> Build and
# deployment -> Source -> "GitHub Actions". See README.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/term_dates.py"
      - "scripts/export_terms.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Export term dates for the site
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/export_terms.py --out site/terms.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
