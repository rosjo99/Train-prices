name: Discover fixture (manual dev tool)

# Manually-triggered helper for Task 3 of docs/plans/001-train-price-alert.md:
# runs scripts/capture_fixture.py against a real date and prints the result
# to the job log, since GitHub Actions has real internet access that the
# interactive development sandbox this project was built in does not.
# Useful for regenerating tests/fixtures/journey_search_sample.json if
# Trainline ever changes its response schema. No secrets required — this
# only fetches public train prices.

on:
  # workflow_dispatch alone won't work until this file exists on the
  # default branch (GitHub only indexes workflow_dispatch workflows from
  # the default branch), which this project hasn't merged to yet. Trigger
  # on push to this branch instead, scoped to files that would actually
  # change discovery output, so it doesn't fire on unrelated commits.
  push:
    branches:
      - claude/train-price-alert-setup-ks7rfg
    paths:
      - ".github/workflows/discover-fixture.yml"
      - "scripts/capture_fixture.py"
      - "scripts/probe_nre.py"
      - "scripts/probe_nre_deeplink.py"
      - "src/scraper.py"
      - "src/config.py"
  workflow_dispatch:
    inputs:
      date:
        description: "Travel date to capture, YYYY-MM-DD (should be a real term-time Tue/Thu/Fri)"
        required: true
        default: "2026-09-08"

jobs:
  discover:
    # Trainline is confirmed blocked by DataDome on GitHub-hosted runners
    # (two independent runs, both blocked immediately) — no need to keep
    # re-running this on every push while iterating on the NRE probe below.
    # Still runnable on demand via workflow_dispatch if needed later.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Capture fixture
        env:
          # `python scripts/capture_fixture.py` (direct script invocation,
          # matching the plan's documented usage) only puts scripts/ on
          # sys.path, not the repo root, so `from src.scraper import ...`
          # can't be found without this. src/main.py's real entrypoint runs
          # via `python -m src.main` instead, which doesn't need this.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/capture_fixture.py \
            --date "${{ inputs.date || '2026-09-08' }}" \
            --out /tmp/fixture.json \
            --artifacts-dir /tmp/artifacts
      - name: Print captured fixture
        if: always()
        run: |
          echo "=== /tmp/fixture.json ==="
          cat /tmp/fixture.json 2>/dev/null || echo "(no fixture written)"
      - name: Print debug artifacts (present only on failure)
        if: always()
        run: |
          echo "=== /tmp/artifacts listing ==="
          ls -la /tmp/artifacts 2>/dev/null || echo "(no artifacts dir)"
          echo "=== captured raw response, if any ==="
          cat /tmp/artifacts/response-*.json 2>/dev/null || echo "(none)"
          echo "=== page HTML, first 200 lines, if any ==="
          head -200 /tmp/artifacts/page-*.html 2>/dev/null || echo "(none)"

  probe-nre:
    # Superseded for now by probe-nre-deeplink below, which tests
    # navigating straight to NRE's query-string-encoded journey-planner
    # URL instead of driving the interactive form. Still runnable on
    # demand via workflow_dispatch if the interactive flow needs
    # revisiting later.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Probe National Rail Enquiries
        run: |
          # No --date: the script defaults to tomorrow (Europe/London),
          # computed fresh on every run. A hardcoded date here would
          # eventually fall into the past as this workflow keeps
          # re-running across real days while iterating.
          python scripts/probe_nre.py --out /tmp/nre_probe
      - name: Print captured responses
        if: always()
        run: |
          echo "=== captured_responses.json ==="
          cat /tmp/nre_probe/captured_responses.json 2>/dev/null || echo "(none)"
      - name: Print page HTML snapshots (truncated)
        if: always()
        run: |
          for f in /tmp/nre_probe/*.html; do
            echo "=== $f (first 100 lines) ==="
            head -100 "$f" 2>/dev/null
          done
      - name: Upload probe artifacts (screenshots etc.)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nre-probe-${{ github.run_id }}
          path: /tmp/nre_probe/
          retention-days: 7
          if-no-files-found: ignore

  probe-nre-deeplink:
    # Tests whether NRE's /journey-planner/?origin=...&destination=...
    # &leavingDate=...&railcards=...  URL format (found by the user in a
    # real example search) pre-fills — or even auto-submits — the
    # journey search, sidestepping every UI-interaction bug hit in the
    # probe-nre job above (decoy click, autocomplete listbox scoping, a
    # React-controlled checkbox/date-button that don't visually update
    # from a raw click).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Probe NRE deep-link URL
        run: |
          python scripts/probe_nre_deeplink.py --out /tmp/nre_deeplink
      - name: Print captured responses
        if: always()
        run: |
          echo "=== captured_responses.json ==="
          cat /tmp/nre_deeplink/captured_responses.json 2>/dev/null || echo "(none)"
      - name: Upload probe artifacts (screenshots etc.)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nre-deeplink-probe-${{ github.run_id }}
          path: /tmp/nre_deeplink/
          retention-days: 7
          if-no-files-found: ignore
