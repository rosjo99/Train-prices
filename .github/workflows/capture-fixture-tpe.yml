name: Capture TPE fixture (manual dev tool)

# Manual dev tool for the NRE -> TPE migration — runs
# scripts/capture_fixture_tpe.py against a real date/time to see TPE's
# actual journey-plan JSON shape. No secrets required — this only fetches
# public train prices.

on:
  workflow_dispatch:
    inputs:
      datetime:
        description: "Anchor departure, YYYY-MM-DDTHH:MM"
        required: true
        default: "2026-12-18T07:00"
      origin:
        required: true
        default: "OXF"
      destination:
        required: true
        default: "PAD"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "camoufox[geoip]"
          python -m camoufox fetch
      - name: Capture TPE fixture
        run: |
          python scripts/capture_fixture_tpe.py \
            --origin "${{ inputs.origin || 'OXF' }}" \
            --destination "${{ inputs.destination || 'PAD' }}" \
            --datetime "${{ inputs.datetime || '2026-12-18T07:00' }}" \
            --out /tmp/tpe-fixture.json
      - name: Print captured fixture
        if: always()
        run: cat /tmp/tpe-fixture.json 2>/dev/null || echo "(no fixture written)"
      - name: Upload fixture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpe-fixture
          path: /tmp/tpe-fixture.json
          if-no-files-found: warn
          retention-days: 14
