# Diagnostic only:
# Does Camoufox successfully load CrossCountry's booking site, or does its
# Cloudflare protection (confirmed blocking plain curl requests, including
# the bare homepage) also block a real GitHub-Actions-hosted browser?
#
# Pure Camoufox attempt – no proxy, no external solver.
name: Probe CrossCountry with Camoufox (manual diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Camoufox
        run: |
          python -m pip install --upgrade pip
          python -m pip install "camoufox[geoip]"

      - name: Show installed versions
        run: |
          python --version
          python -m pip show camoufox
          python -m pip show playwright || true

      - name: Fetch Camoufox browser
        run: |
          python -m camoufox fetch

      - name: Verify Camoufox installation
        run: |
          python -m camoufox version
          python -m camoufox path
          python -m camoufox list

      - name: Run Camoufox probe
        id: probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/probe_camoufox_crosscountry.py \
            --out-dir /tmp/camoufox-probe-cc

      - name: Print probe summary
        if: always()
        run: |
          if [ -f /tmp/camoufox-probe-cc/summary.json ]; then
            echo "===== summary.json ====="
            cat /tmp/camoufox-probe-cc/summary.json
          else
            echo "No summary.json was produced"
          fi

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-crosscountry-probe
          path: /tmp/camoufox-probe-cc
          if-no-files-found: warn
          retention-days: 14
