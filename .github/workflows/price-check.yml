name: Train price check

# Runs the real daily price check. See docs/plans/001-train-price-alert.md
# Task 7 for background on earlier scheduling designs (since superseded —
# there is no time-of-day gate in src/main.py any more, see below).
#
# There is exactly one way to test this manually: click "Run workflow".
# That's it — no checkboxes to configure. A workflow_dispatch run always
# does the complete real thing (scrape, write to price-history.csv, send
# a real email through Resend) — see TEST_RUN below, driven purely by
# github.event_name.

on:
  schedule:
    # Every 6 hours, at :37 rather than the top of the hour so this
    # doesn't line up with GitHub Actions' own peak-load minute (cron
    # jobs bunched at :00 are the ones most likely to be delayed) — see
    # "GitHub Actions cron is best-effort" below. There is deliberately
    # no Python-side time-of-day gate any more: which travel *dates* get
    # checked is still fully gated by term/weekday logic in
    # src/term_dates.py, but *when* this job itself runs is left entirely
    # to this cron expression, so a run that fires late or is occasionally
    # skipped just checks the same dates a few hours later/next time —
    # harmless, and no longer something Python has to reason about.
    - cron: "37 */6 * * *"
  # No inputs, deliberately: a manual run always checks every remaining
  # candidate date, exactly like a scheduled run — see "Run price check"
  # below. There used to be a max_dates input for a quicker manual test,
  # removed per explicit request so every manual run is a full, real
  # measurement rather than a partial one.
  workflow_dispatch:

concurrency:
  group: train-price-check
  cancel-in-progress: false

permissions:
  contents: write # needed to commit price-history.csv back after each run

jobs:
  check:
    runs-on: ubuntu-latest
    # Every remaining term-time Tue/Thu/Fri is checked on every run (see
    # plan §2.2) — still up to ~100+ dates early in a term (candidate-list
    # size is unchanged, see docs/plans/002-speed-up-price-check-run.md
    # Decisions §1), scraped up to PARALLEL_DATES at once via a continuous
    # scheduler (see src/main.py) rather than one at a time or in fixed
    # batches. Per-date cost dropped sharply once the navigation/poll/
    # backoff timings and per-date attempt count were tuned to measured
    # values (see src/scraper.py and src/main.py's
    # FULL_RETRY_HORIZON_DAYS): a real scheduled run measured at 315s
    # (5m15s) total before those changes, projected at roughly 1m50s-2m
    # after — see docs/plans/002-speed-up-price-check-run.md §1/§10 and
    # docs/plans/003-scheduler-and-retry-horizon.md §4.7/§11. 20 minutes
    # keeps real headroom over that projection without leaving 18+
    # minutes of dead slack. A manual run checks every date too (see
    # workflow_dispatch above), so it takes roughly the same time as a
    # scheduled run rather than finishing early.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      # No --with-deps: confirmed live on run 33489993285 (2026-09-01)
      # that --with-deps installs nothing this scraper actually needs on
      # the ubuntu-24.04 runner image — every shared library Chromium
      # requires (libnss3, libcairo2, libasound2t64, ...) was already
      # present ("is already the newest version"), and the only 9
      # packages it did install were fonts (fonts-ipafont-gothic,
      # fonts-freefont-ttf, ...), which this scraper never needs since it
      # reads a JSON XHR rather than rendering/reading glyphs. The
      # apt-get update this triggers cost ~16s on every run, uncacheable
      # since runners are fresh VMs each time. If a future runner image
      # ever drops one of those shared libraries, Chromium simply fails
      # to launch, src/scraper.py's _launch_browser turns that into a
      # clear ScraperError, the job fails loudly and uploads artifacts —
      # and the fix is putting --with-deps back, a one-word revert.
      - run: playwright install chromium
      - name: Run price check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          # Driven purely by trigger type, with no separate user choice:
          # a manual run always sends a genuine email using real scraped
          # data (never staying silent just because nothing was under
          # threshold) — see src/main.py's `TEST_RUN` handling. Scheduled
          # (cron) runs never set this.
          TEST_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python -m src.main
      - name: Commit updated price history
        if: always()
        run: |
          if [ -n "$(git status --porcelain price-history.csv 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add price-history.csv
            git commit -m "Record prices checked on $(date -u +%Y-%m-%d)"
            # Rebase onto the latest remote tip first in case the
            # booked-dates site (or another run) committed in the
            # meantime, then push — retries once on a race.
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "price-history.csv unchanged (no dates were successfully checked this run) — nothing to commit"
          fi
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
