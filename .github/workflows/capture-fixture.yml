name: Capture NRE fixture (manual dev tool)

# Standalone from discover-fixture.yml (the exploratory probe scripts)
# deliberately: this is the one job that matters for Task 4 of
# docs/plans/001-train-price-alert.md — running the production
# scripts/capture_fixture.py against a real date to produce
# tests/fixtures/journey_search_sample.json. Keeping it in its own
# workflow file means dispatching it never also re-runs the probe
# scripts in discover-fixture.yml, which was confusing (both fired
# together under a shared workflow_dispatch trigger) and unnecessary —
# the deep-link approach they were investigating is already confirmed
# and implemented in src/scraper.py. No secrets required — this only
# fetches public train prices.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Travel date to capture, YYYY-MM-DD (should be a real term-time Tue/Thu/Fri)"
        required: true
        default: "2026-09-08"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Capture fixture
        env:
          # `python scripts/capture_fixture.py` (direct script invocation,
          # matching the plan's documented usage) only puts scripts/ on
          # sys.path, not the repo root, so `from src.scraper import ...`
          # can't be found without this. src/main.py's real entrypoint runs
          # via `python -m src.main` instead, which doesn't need this.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/capture_fixture.py \
            --date "${{ inputs.date || '2026-09-08' }}" \
            --out /tmp/fixture.json \
            --artifacts-dir /tmp/artifacts
      - name: Print captured fixture
        if: always()
        run: |
          echo "=== /tmp/fixture.json ==="
          cat /tmp/fixture.json 2>/dev/null || echo "(no fixture written)"
      - name: Print debug artifacts (present only on failure)
        if: always()
        run: |
          echo "=== /tmp/artifacts listing ==="
          ls -la /tmp/artifacts 2>/dev/null || echo "(no artifacts dir)"
          echo "=== captured raw response, if any ==="
          cat /tmp/artifacts/response-*.json 2>/dev/null || echo "(none)"
          echo "=== page HTML, first 200 lines, if any ==="
          head -200 /tmp/artifacts/page-*.html 2>/dev/null || echo "(none)"
